services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantum_atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  quantum-service:
    build: ./quantum-service
    ports:
      - "8000:8000"
  backend:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quantum_atlas
      JWT_SECRET: change-this-in-production
      QUANTUM_SERVICE_URL: http://quantum-service:8000
    depends_on:
      - postgres
      - quantum-service
    ports:
      - "5000:5000"
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  postgres_data:
